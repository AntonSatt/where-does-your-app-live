apiVersion: v1
kind: ServiceAccount
metadata:
  name: where-does-your-app-live
  labels:
    app.kubernetes.io/name: where-does-your-app-live
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: where-does-your-app-live
  labels:
    app.kubernetes.io/name: where-does-your-app-live
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: where-does-your-app-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: where-does-your-app-live
    spec:
      serviceAccountName: where-does-your-app-live
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: where-does-your-app-live
          image: registry.ankra.cloud/org-7a53f4b6-bfe5-42d9-86f7-5fedbf95e547/where-does-your-app-live:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: where-does-your-app-live-db-app
                  key: uri
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: where-does-your-app-live-db-app
                  key: host
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 150
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
